apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
spec:
  template:
    spec:
      containers:
        - name: nginx-gateway
          env:
            - name: BUCKET_DOMAIN
              valueFrom:
                configMapKeyRef:
                  key: bucket_domain
                  name: configuration
            - name: IMAGES_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  key: images_bucket_name
                  name: configuration
            - name: FILES_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  key: files_bucket_name
                  name: configuration
            - name: FIREFOX_EXT_S3_BUCKET_DIR
              valueFrom:
                configMapKeyRef:
                  name: admin-ui
                  key: firefox_ext_s3_bucket_dir
              # value: ff-extension
            - name: BUCKET_REGION
              valueFrom:
                configMapKeyRef:
                  key: bucket_region
                  name: configuration
            - name: BUCKET_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  key: bucket_access_key_id
                  name: configuration
            - name: BUCKET_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: bucket_secret_access_key
                  name: configuration
          volumeMounts:
            - mountPath: /etc/nginx/njs/s3-sign.js
              name: zhe-gw-s3-sign-volume
              subPath: s3-sign.js
      volumes:
        - configMap:
            name: zhe-gw-s3-sign
          name: zhe-gw-s3-sign-volume
